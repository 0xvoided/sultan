<style>
  :root{
    --bg:#000000;
    --accent:#e4e4e7;

    --surface:#060606;
    --surface-hover:#0e0e0e;
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.22);
    --highlight:0 0 0 0 transparent;

    --ink:#ffffff;
    --ink-dim:rgba(255,255,255,.68);
    --ink-faint:rgba(255,255,255,.42);

    --r-sm:10px;
    --r-md:18px;
    --r-lg:24px;

    --mono:'JetBrains Mono', ui-monospace, monospace;
    --body:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ease:cubic-bezier(0.16, 1, 0.3, 1);
    --col:440px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ overflow-x:hidden; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }

  ::selection{ background:rgba(255,255,255,.22); color:#fff; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:var(--r-sm); }

  .bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:#000;
  }
  #spaceCanvas{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    width:100%; height:100%;
  }

  .main-card{
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh;
    width:min(var(--col), calc(100% - 40px));
    margin:0 auto;
    padding:48px 0 56px;
    text-align:center;
  }
  .main-card > *{ animation:rise .8s var(--ease) both; }
  .main-card > *:nth-child(1){ animation-delay:.02s; }
  .main-card > *:nth-child(2){ animation-delay:.08s; }
  .main-card > *:nth-child(3){ animation-delay:.14s; }
  .main-card > *:nth-child(4){ animation-delay:.20s; }
  .main-card > *:nth-child(5){ animation-delay:.26s; }
  .main-card > *:nth-child(6){ animation-delay:.32s; }
  .main-card > *:nth-child(7){ animation-delay:.38s; }
  .main-card > *:nth-child(8){ animation-delay:.44s; }
  .main-card > *:nth-child(n+9){ animation-delay:.5s; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:none; }
  }

  .avatar-wrap{
    position:relative;
    width:148px; height:148px;
    margin-bottom:24px;
  }
  .avatar-ring{
    position:absolute; inset:0;
    border-radius:50%;
    overflow:hidden;
    background:#0e0e10;
    border:1px solid var(--border-strong);
    box-shadow:none;
  }
  .avatar-ring img{
    width:100%; height:100%;
    object-fit:cover; display:block;
    transition:transform .5s var(--ease);
  }
  .avatar-ring:hover img{ transform:scale(1.06); }

  .status-dot{
    position:absolute;
    width:20px; height:20px;
    right:8px; bottom:8px;
    border-radius:50%;
    background:#747f8d;
    border:4px solid #000;
    box-sizing:content-box;
    transition:background .3s ease;
    z-index:2;
  }
  .status-dot.online{ background:#50fa7b; }
  .status-dot.idle{ background:#ffb86c; }
  .status-dot.dnd{ background:#ff5555; }
  .status-dot.offline{ background:#5a5a60; }

  .name{
    font-weight:800;
    font-size:clamp(36px, 4vw, 48px);
    line-height:1;
    letter-spacing:-0.04em;
    color:#fff;
  }

  .whisper{
    margin-top:12px;
    font-family:var(--mono);
    font-size:12px; letter-spacing:.14em;
    color:var(--ink-faint);
    min-height:16px;
    transition:opacity 1.2s ease;
  }
  .whisper.out{ opacity:0; }

  .discord-note{
    margin-top:14px;
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 14px;
    font-size:14px; font-weight:500;
    color:var(--ink-dim);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    box-shadow:var(--highlight);
    max-width:100%;
    word-break:break-word;
    min-height:34px;
  }
  .note-icon{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; flex-shrink:0; }
  .note-icon svg{ width:100%; height:100%; fill:var(--ink-dim); }
  .note-img{ width:20px; height:20px; border-radius:5px; object-fit:contain; flex-shrink:0; }
  .note-text{ color:var(--ink-dim); }

  .activity-card{
    margin-top:18px;
    display:none;
    align-items:center; justify-content:space-between; gap:14px;
    width:100%;
    padding:12px 18px 12px 12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-md);
    box-shadow:var(--highlight);
        transition:background .3s ease, border-color .3s ease, transform .3s var(--ease);
  }
  .activity-card + .activity-card{ margin-top:10px; }
  .activity-card:hover{
    background:var(--surface-hover);
    border-color:var(--border-strong);
    transform:translateY(-1px);
  }
  .activity-left{ display:flex; align-items:center; gap:14px; min-width:0; flex:1; }
  .activity-thumb-wrap{
    position:relative;
    width:46px; height:46px;
    border-radius:var(--r-sm);
    overflow:hidden;
    background:rgba(255,255,255,.06);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .activity-thumb{ width:100%; height:100%; object-fit:cover; display:block; }
  .activity-thumb-placeholder{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint);
  }
  .activity-thumb-placeholder svg{ width:18px; height:18px; fill:currentColor; }

  .activity-details{ display:flex; flex-direction:column; text-align:left; min-width:0; flex:1; }
  .activity-tag{
    font-size:12px; font-weight:600;
    color:var(--accent);
    display:flex; align-items:center; gap:6px;
    line-height:1; margin-bottom:6px;
  }
  .activity-tag-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .activity-tag-time{ opacity:.7; font-weight:500; font-variant-numeric:tabular-nums; }
  .activity-tag-time:not(:empty)::before{ content:"· "; }
  .activity-title{
    font-size:15px; font-weight:700; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.25;
  }
  .activity-sub{
    font-size:13px; font-weight:500;
    color:var(--ink-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-align:right; flex-shrink:0; max-width:42%;
  }

  .activity-eq, .eq{
    position:absolute; right:4px; bottom:4px;
    display:flex; align-items:flex-end; gap:2px;
    width:14px; height:12px;
    padding:2px 3px; border-radius:5px;
    background:rgba(8,8,10,.85);
  }
  .activity-eq span, .eq span{
    width:2px; height:30%;
    background:var(--accent);
    border-radius:1px;
    animation:bounce 1s ease-in-out infinite;
  }
  .eq span{ animation-play-state:paused; }
  .player-container.playing .eq span{ animation-play-state:running; }
  .activity-eq span:nth-child(1), .eq span:nth-child(1){ animation-delay:-.6s; }
  .activity-eq span:nth-child(2), .eq span:nth-child(2){ animation-delay:-.3s; }
  .activity-eq span:nth-child(3), .eq span:nth-child(3){ animation-delay:0s; }
  @keyframes bounce{ 0%,100%{ height:22%; } 50%{ height:100%; } }

  .stats{
    margin-top:26px;
    font-family:var(--mono);
    font-size:12.5px; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex-wrap:wrap;
  }
  #clockTime{ color:var(--ink-dim); font-variant-numeric:tabular-nums; font-weight:600; }
  .dot-sep{ opacity:.5; }

  .channels{
    display:flex; flex-direction:column;
    width:100%; gap:8px;
    margin-top:22px;
  }
  .channel{
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:14px;
    padding:11px 16px 11px 11px;
    text-decoration:none;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--highlight);
        transition:background .3s ease, border-color .3s ease, transform .3s var(--ease);
    text-align:left;
  }
  .channel:hover{
    background:var(--surface-hover);
    border-color:var(--border-strong);
    transform:translateY(-1px);
  }
  .channel:active{ transform:translateY(0) scale(.99); }
  .channel-icon{
    position:relative;
    width:40px; height:40px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    color:var(--ink-dim);
    background:#0b0b0b;
    border:1px solid var(--border);
    transition:color .3s ease, background .3s ease, border-color .3s ease;
  }
  .channel-icon svg{
    width:19px; height:19px;
    fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .channel:hover .channel-icon{ color:#fff; background:#151515; border-color:var(--border-strong); }
  .channel-text{ position:relative; display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }
  .channel-name{ font-weight:700; font-size:14.5px; line-height:1.1; letter-spacing:-0.01em; text-transform:capitalize; }
  .channel-handle{
    font-family:var(--mono);
    font-size:12px; font-weight:500; line-height:1.1;
    color:var(--ink-faint);
    transition:color .3s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .channel:hover .channel-handle{ color:var(--ink-dim); }
  .channel-arrow{
    position:relative;
    font-size:15px; color:var(--ink-faint);
    transition:transform .3s var(--ease), color .3s ease;
    flex-shrink:0;
  }
  .channel:hover .channel-arrow{ transform:translate(3px,-3px); color:#fff; }

  .footer-note{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:30px;
  }

  .player-container{
    width:100%;
    margin-top:26px;
  }
  .player-card{
    width:100%;
    text-align:left;
    background:var(--surface);
        border:1px solid var(--border);
    border-radius:var(--r-md);
    box-shadow:var(--highlight);
    padding:12px 16px;
    transition:border-color .3s ease;
  }
  .player-card:hover{ border-color:var(--border-strong); }
  .player-row{ display:flex; align-items:center; flex-wrap:wrap; gap:12px; }

  .art-wrap{
    position:relative;
    width:42px; height:42px;
    border-radius:10px;
    overflow:hidden;
    background:#101012;
    flex-shrink:0;
  }
  .art-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }

  .meta{ min-width:0; flex:1 1 0; text-align:left; }
  .meta .now-playing{ font-size:11px; font-weight:600; color:var(--accent); margin-bottom:3px; }
  .meta .title{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta .artist{ font-size:12.5px; font-weight:500; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }

  .player-controls-right{ display:flex; align-items:center; gap:12px; }

  .play-btn{
    width:38px; height:38px; border-radius:50%;
    background:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:transform .2s ease;
  }
  .play-btn:hover{ transform:scale(1.07); }
  .play-btn:active{ transform:scale(.94); }
  .play-btn svg{ width:16px; height:16px; fill:#09090b; }

  .volume-wrap{ display:flex; align-items:center; gap:8px; }
  .volume-wrap svg{ width:14px; height:14px; fill:var(--ink-dim); flex-shrink:0; }
  .volume-slider{
    -webkit-appearance:none; appearance:none;
    width:64px; height:4px; border-radius:999px;
    background:rgba(255,255,255,.18);
    outline:none; cursor:pointer;
  }
  .volume-slider::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; }
  .volume-slider::-moz-range-thumb{ width:12px; height:12px; border:none; border-radius:50%; background:#fff; cursor:pointer; }

  .player-times{ display:flex; align-items:center; gap:10px; order:3; flex:1 1 100%; margin-top:2px; }
  .player-times span{
    font-family:var(--mono);
    font-size:11px; color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
    min-width:30px;
  }
  #timeDur{ text-align:right; }
  .player-progress{
    position:relative; flex:1;
    height:4px;
    background:rgba(255,255,255,.14);
    cursor:pointer;
    border-radius:999px;
  }
  .player-progress::before{ content:""; position:absolute; inset:-9px 0; }
  .player-progress-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width .15s linear;
  }

  @media (max-width: 900px){
    .main-card{ padding:36px 0 48px; }
    .avatar-wrap{ width:132px; height:132px; margin-bottom:20px; }
    .name{ font-size:38px; }
    .volume-slider{ width:52px; }
    .player-card{ padding:12px 14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<script>
  (function initRain(){
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;
    const mobile = window.innerWidth < 700;
    const DROPS = mobile ? 18 : 34;
    const DUST = mobile ? 14 : 24;
    let drops = [], dust = [], ripples = [];

    function resize(){
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function newDrop(top){
      return {
        x: Math.random() * (W + 80) - 40,
        y: top ? -Math.random() * 60 : Math.random() * H,
        len: Math.random() * 16 + 8,
        v: Math.random() * 7 + 9,
        a: Math.random() * 0.08 + 0.025
      };
    }
    for(let i=0;i<DROPS;i++) drops.push(newDrop(false));
    for(let i=0;i<DUST;i++){
      dust.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.1+.3,
        a:Math.random()*.4, da:(Math.random()*.006+.002), vy:-(Math.random()*.15+.03) });
    }

    let visible = true;
    document.addEventListener('visibilitychange', () => {
      visible = !document.hidden;
      if(visible) requestAnimationFrame(draw);
    });

    const WIND = -2.2;
    function draw(){
      if(!visible) return;
      ctx.clearRect(0,0,W,H);

      for(const d of dust){
        d.a += d.da; if(d.a > .45 || d.a < 0) d.da = -d.da;
        d.y += d.vy; if(d.y < -5){ d.y = H + 5; d.x = Math.random()*W; }
        ctx.fillStyle = `rgba(220,220,225,${Math.abs(d.a) * .8})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832); ctx.fill();
      }

      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      for(const p of drops){
        ctx.strokeStyle = `rgba(210,210,215,${p.a})`;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + WIND * p.len / 14, p.y + p.len);
        ctx.stroke();
        p.x += WIND * p.v / 14;
        p.y += p.v;
        if(p.y > H){
          if(Math.random() < .08 && ripples.length < 8){
            ripples.push({ x:p.x, y:H - 2 - Math.random()*14, r:1, a:.18 });
          }
          Object.assign(p, newDrop(true));
        }
      }

      for(let i = ripples.length - 1; i >= 0; i--){
        const r = ripples[i];
        r.r += .7; r.a -= .008;
        if(r.a <= 0){ ripples.splice(i,1); continue; }
        ctx.strokeStyle = `rgba(210,210,215,${r.a})`;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r*2.4, r.r*.7, 0, 0, 6.2832); ctx.stroke();
      }
      requestAnimationFrame(draw);
    }
    draw();
  })();

  (function whispers(){
    const lines = [
      "you're not the same.",
      "still here. you're not.",
      "the rain remembers.",
      "i kept the light on.",
      "who left first?",
      "somewhere between then and now.",
      "drifting through the void."
    ];
    const el = document.getElementById('whisper');
    let i = 0;
    setInterval(() => {
      el.classList.add('out');
      setTimeout(() => {
        i = (i + 1) % lines.length;
        el.textContent = lines[i];
        el.classList.remove('out');
      }, 1300);
    }, 6500);
  })();

  (function tabTitle(){
    const base = 'throwvoid';
    document.addEventListener('visibilitychange', () => {
      document.title = document.hidden ? 'come back.' : base;
    });
  })();

  const ICONS = {
    instagram: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>',
    twitter: '<svg viewBox="0 0 24 24"><path d="M5 4l14 16M19 4L5 20"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24"><path d="M14 4v10.2a3.7 3.7 0 1 1-3.7-3.7"/><path d="M14 4c.4 2.6 2.1 4.2 4.6 4.4"/></svg>',
    discord: '<svg viewBox="0 0 24 24"><path d="M5.5 6.5C7.6 5.4 9.7 5 12 5s4.4.4 6.5 1.5c1.4 3 2 6 1.8 9.6-1.4 1-2.8 1.6-4.2 1.9l-.9-1.6c-1.4.4-2.8.4-4.4 0l-.9 1.6c-1.4-.3-2.8-.9-4.2-1.9-.2-3.6.4-6.6 1.8-9.6z"/><circle cx="9.3" cy="12" r="1" fill="currentColor"/><circle cx="14.7" cy="12" r="1" fill="currentColor"/></svg>',
    link: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.3 2.5 13.7 0 16M12 4c-2.5 2.3-2.5 13.7 0 16"/></svg>'
  };

  if (typeof CONFIG !== 'undefined') {
    document.getElementById('songTitle').textContent = CONFIG.songTitle || "";
    document.getElementById('songArtist').textContent = CONFIG.songArtist || "";
    if(CONFIG.songArt && CONFIG.songArt.trim()){
      document.getElementById('songArt').src = CONFIG.songArt.trim();
    }

    const channelsContainer = document.getElementById('channelsContainer');
    channelsContainer.innerHTML = '';

    if (CONFIG.socials) {
      for (const [key, rawUrl] of Object.entries(CONFIG.socials)) {
        if (!rawUrl || typeof rawUrl !== 'string') continue;
        const trimmed = rawUrl.trim();
        if (!trimmed) continue;

        let handleText = '';
        try {
          const parsed = new URL(trimmed);
          const segs = parsed.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
          const lastSeg = segs.length ? segs[segs.length - 1] : '';
          if (!lastSeg || lastSeg.includes('.')) continue;
          handleText = '@' + lastSeg.replace(/^@/,'');
        } catch(e) {
          continue;
        }

        const a = document.createElement('a');
        a.className = 'channel';
        a.href = trimmed;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = `
          <span class="channel-icon">${ICONS[key] || ICONS.link}</span>
          <span class="channel-text">
            <span class="channel-name">${key === 'twitter' ? 'X' : key}</span>
            <span class="channel-handle">${handleText}</span>
          </span>
          <span class="channel-arrow">↗</span>
        `;
        channelsContainer.appendChild(a);
      }
    }

    const discordUrl = CONFIG.socialUrl || (CONFIG.discordId ? `https://discord.com/users/${CONFIG.discordId}` : '');
    if (discordUrl) {
      const discordA = document.createElement('a');
      discordA.className = 'channel';
      discordA.href = discordUrl;
      discordA.target = '_blank';
      discordA.rel = 'noopener';
      discordA.innerHTML = `
        <span class="channel-icon">${ICONS.discord}</span>
        <span class="channel-text">
          <span class="channel-name">Discord</span>
          <span class="channel-handle">View profile</span>
        </span>
        <span class="channel-arrow">↗</span>
      `;
      channelsContainer.appendChild(discordA);
    }
  }

  const clockEl = document.getElementById('clockTime');
  function updateClock(){
    clockEl.textContent = new Date().toLocaleTimeString('en-US', {
      timeZone:'Asia/Riyadh', hour:'2-digit', minute:'2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 1000);

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const playerContainer = document.getElementById('playerContainer');
  const progressFill = document.getElementById('progressFill');
  const progressTrack = document.getElementById('progressTrack');
  const volumeSlider = document.getElementById('volumeSlider');
  const timeCur = document.getElementById('timeCur');
  const timeDur = document.getElementById('timeDur');

  audio.volume = volumeSlider.value;
  volumeSlider.addEventListener('input', (e) => {
    audio.volume = e.target.value;
  });

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  function playAudio(){ audio.play().catch(() => {}); }
  function pauseAudio(){ audio.pause(); }

  audio.addEventListener('play', () => {
    playIcon.innerHTML = ICON_PAUSE;
    playBtn.setAttribute('aria-label', 'pause');
    playerContainer.classList.add('playing');
    updateActivityDisplay();
  });
  audio.addEventListener('pause', () => {
    playIcon.innerHTML = ICON_PLAY;
    playBtn.setAttribute('aria-label', 'play');
    playerContainer.classList.remove('playing');
    updateActivityDisplay();
  });

  playBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.paused ? playAudio() : pauseAudio();
  });

  function unlockAudio(){
    if(audio.paused){ playAudio(); }
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
  }
  document.addEventListener('click', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const r = Math.floor(s % 60);
    return m + ':' + String(r).padStart(2, '0');
  }
  function paintTime(){
    timeCur.textContent = fmtTime(audio.currentTime);
    timeDur.textContent = fmtTime(audio.duration);
  }
  ['loadedmetadata', 'durationchange'].forEach(ev => audio.addEventListener(ev, paintTime));

  audio.addEventListener('timeupdate', () => {
    if(audio.duration){ progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%'; }
    paintTime();
  });

  progressTrack.addEventListener('click', (e) => {
    const rect = progressTrack.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if(audio.duration){ audio.currentTime = ratio * audio.duration; }
  });

  const statusDot = document.getElementById('statusDot');
  const discordNote = document.getElementById('discordNote');
  const noteIcon = document.getElementById('noteIcon');
  const noteText = document.getElementById('noteText');
  const mainAvatarImg = document.getElementById('mainAvatarImg');

  const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20.7 15.3A8.6 8.6 0 0 1 8.7 3.3a9 9 0 1 0 12 12z"/></svg>';

  function getAssetUrl(appId, assetId) {
    if(!assetId) return null;
    if(assetId.startsWith('mp:external/')) {
      return `https://media.discordapp.net/${assetId.replace('mp:', '')}`;
    }
    return `https://cdn.discordapp.com/app-assets/${appId}/${assetId}.png`;
  }

  const appIconCache = {};
  async function getAppIconUrl(appId) {
    if (!appId) return null;
    if (appId in appIconCache) return appIconCache[appId];
    try {
      const r = await fetch(`https://discord.com/api/v10/applications/${appId}/rpc`);
      if (!r.ok) throw new Error('bad status');
      const j = await r.json();
      appIconCache[appId] = j.icon
        ? `https://cdn.discordapp.com/app-icons/${appId}/${j.icon}.png?size=128`
        : null;
    } catch (e) {
      appIconCache[appId] = null;
    }
    return appIconCache[appId];
  }

  let latestData = null;
  const cardTimes = { activity: { start: null, end: null }, game: { start: null, end: null } };
  let activityTimerInterval = null;

  function formatElapsed(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  function tickActivityTime() {
    Object.keys(cardTimes).forEach((key) => {
      const el = document.getElementById(key + 'TagTime');
      if (!el) return;
      const t = cardTimes[key];
      if (!t.start) {
        el.textContent = '';
        return;
      }
      const now = Date.now();
      el.textContent = (t.end && now >= t.end) ? formatElapsed(t.end - t.start) : formatElapsed(now - t.start);
    });
  }

  function startActivityTimer() {
    tickActivityTime();
    if (!activityTimerInterval) activityTimerInterval = setInterval(tickActivityTime, 1000);
  }

  function fillCard(key, d) {
    const card = document.getElementById(key + 'Card');
    if (!d) {
      card.style.display = 'none';
      cardTimes[key] = { start: null, end: null };
      return;
    }
    const thumb = document.getElementById(key + 'Thumb');
    const placeholder = document.getElementById(key + 'Placeholder');
    card.style.display = 'flex';
    if (d.img) {
      thumb.src = d.img;
      thumb.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      thumb.style.display = 'none';
      placeholder.style.display = 'flex';
    }
    document.getElementById(key + 'Tag').style.color = d.color;
    document.getElementById(key + 'TagText').textContent = d.tag;
    document.getElementById(key + 'Title').textContent = d.title;
    document.getElementById(key + 'Sub').textContent = d.sub;
    document.getElementById(key + 'Eq').style.display = d.eq ? 'flex' : 'none';
    cardTimes[key] = { start: d.start || null, end: d.end || null };
    startActivityTimer();
  }

  function updateActivityDisplay() {
    const spotify = latestData && latestData.listening_to_spotify ? latestData.spotify : null;
    const activities = latestData && latestData.activities ? latestData.activities : [];
    const game = activities.find(a => a.type === 0);

    if (spotify) {
      fillCard('activity', {
        img: spotify.album_art_url || null,
        color: 'var(--accent)',
        tag: 'spotify',
        title: spotify.song,
        sub: spotify.artist,
        eq: true,
        start: (spotify.timestamps && spotify.timestamps.start) || spotify.created_at || null,
        end: (spotify.timestamps && spotify.timestamps.end) || null
      });
    } else {
      fillCard('activity', null);
    }

    if (game) {
      const imgUrl = game.assets && game.assets.large_image ? getAssetUrl(game.application_id, game.assets.large_image) : null;
      fillCard('game', {
        img: imgUrl,
        color: 'var(--accent)',
        tag: 'playing',
        title: game.name,
        sub: game.details || game.state || 'In game',
        eq: false,
        start: (game.timestamps && game.timestamps.start) || game.created_at || null,
        end: (game.timestamps && game.timestamps.end) || null
      });
      if (!imgUrl && game.application_id) {
        getAppIconUrl(game.application_id).then(url => {
          if (!url) return;
          const stillSame = latestData && (latestData.activities || []).some(a => a.type === 0 && a.application_id === game.application_id);
          if (!stillSame) return;
          document.getElementById('gameThumb').src = url;
          document.getElementById('gameThumb').style.display = 'block';
          document.getElementById('gamePlaceholder').style.display = 'none';
        });
      }
    } else {
      fillCard('game', null);
    }
  }

  function renderPresence(data){
    latestData = data;
    const activities = data.activities || [];
    const custom = activities.find(a => a.type === 4);

    const oldNoteImg = discordNote.querySelector('.note-img');
    if (oldNoteImg) oldNoteImg.remove();
    noteIcon.style.display = 'inline-flex';

    if (custom && (custom.state || custom.emoji)) {
      if (custom.emoji && custom.emoji.id) {
        noteIcon.style.display = 'none';
        const img = document.createElement('img');
        img.className = 'note-img';
        img.src = `https://cdn.discordapp.com/emojis/${custom.emoji.id}.${custom.emoji.animated ? 'gif' : 'png'}?size=32`;
        discordNote.insertBefore(img, noteText);
      } else if (custom.emoji && custom.emoji.name) {
        noteIcon.textContent = custom.emoji.name;
      } else {
        noteIcon.innerHTML = ICON_MOON;
      }
      noteText.textContent = custom.state || '';
    } else {
      noteIcon.innerHTML = ICON_MOON;
      noteText.textContent = 'into the void.';
    }

    updateActivityDisplay();
  }

  async function updateDiscordStatus(){
    try{
      if (typeof CONFIG === 'undefined' || !CONFIG.discordId) return;
      const res = await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordId}`);
      if (!res.ok) return;
      const json = await res.json();
      if(!json.success) return;

      const status = json.data.discord_status || 'offline';
      statusDot.className = `status-dot ${status}`;

      const du = json.data.discord_user;
      if(du && du.avatar){
        const ext = du.avatar.startsWith('a_') ? 'gif' : 'png';
        const avatarUrl = `https://cdn.discordapp.com/avatars/${du.id}/${du.avatar}.${ext}?size=512`;

        if (mainAvatarImg.src !== avatarUrl) {
          mainAvatarImg.src = avatarUrl;
        }

        const favicon = document.getElementById('siteFavicon');
        if (favicon && favicon.href !== avatarUrl) {
          favicon.href = avatarUrl;
        }
      }

      renderPresence(json.data);
    }catch(e){
      statusDot.className = 'status-dot offline';
      noteIcon.innerHTML = ICON_MOON;
      noteText.textContent = 'into the void.';
      updateActivityDisplay();
    }
  }

  updateDiscordStatus();
  setInterval(updateDiscordStatus, 5000);
</script>

</body>
</html>
